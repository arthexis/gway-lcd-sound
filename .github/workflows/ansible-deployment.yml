name: Ansible deployment
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible
        run: python -m pip install 'ansible-core>=2.16,<2.19'
      - name: Validate playbook syntax
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: ansible-playbook ansible/playbooks/install.yml -i localhost, -c local --syntax-check
      - name: Deploy LCD Sound in isolated HOME
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          mkdir -p "$HOME"
          sh deploy.sh
          test -L "$HOME/.local/share/gway-lcd-sound/current"
          test -x "$HOME/.local/bin/lcd-lockfile-runner"
          test -x "$HOME/.local/bin/gway-event-sound-monitor"
      - name: Redeploy same SHA and verify idempotency
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          before=$(readlink "$HOME/.local/share/gway-lcd-sound/current")
          sh deploy.sh
          after=$(readlink "$HOME/.local/share/gway-lcd-sound/current")
          test "$before" = "$after"
          test -z "$(find "$HOME/.local/share/gway-lcd-sound/releases" -maxdepth 1 -name '.staging.*' -print -quit)"
      - name: Reject corrupted existing release
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          current="$HOME/.local/share/gway-lcd-sound/current"
          target=$(readlink -f "$current")
          rm -f "$target/scripts/gway/lcd_engine/hardware/discovery.py"
          if sh deploy.sh; then
            echo "Corrupt immutable release unexpectedly accepted" >&2
            exit 1
          fi
          test "$(readlink -f "$current")" = "$target"

  deploy-gway001:
    name: Deploy gway-001 (main only)
    if: github.repository == 'arthexis/gway-lcd-sound' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: install
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 15
    concurrency:
      group: gway-lcd-sound-gway001
      cancel-in-progress: false
    steps:
      - name: Skip superseded main revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api repos/arthexis/gway-lcd-sound/branches/main --jq '.commit.sha')"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "::notice::Skipping superseded main revision $TARGET_SHA"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.revision.outputs.skip != 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy immutable LCD Sound release with existing Ansible installer
        if: steps.revision.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = arthe
          command -v ansible-playbook
          command -v flock
          test -f deploy.sh
          sh deploy.sh
          expected="$HOME/.local/share/gway-lcd-sound/releases/${GITHUB_SHA:0:12}"
          test "$(readlink -f "$HOME/.local/share/gway-lcd-sound/current")" = "$expected"
          test "$(readlink "$HOME/.local/bin/sound")" = /usr/local/bin/sound
          test "$(readlink /usr/local/bin/sound)" = /usr/local/libexec/gway-home-tools/sound.sh
