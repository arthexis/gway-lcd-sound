name: Ansible deployment
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible
        run: python -m pip install 'ansible-core>=2.16,<2.19'
      - name: Validate playbook syntax
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: ansible-playbook ansible/playbooks/install.yml -i localhost, -c local --syntax-check
      - name: Validate opt-in MCP playbooks syntax without execution
        run: |
          ansible-playbook ansible/playbooks/stage-mcp-release.yml -i localhost, -c local --syntax-check
          ansible-playbook ansible/playbooks/publish-mcp.yml -i localhost, -c local --syntax-check
      - name: Exercise opt-in MCP staging in isolated HOME only
        env:
          HOME: ${{ runner.temp }}/lcd-sound-mcp-home
        run: |
          mkdir -p "$HOME"
          revision=$(git rev-parse HEAD)
          ansible-playbook ansible/playbooks/stage-mcp-release.yml -i localhost, -c local -e "lcd_sound_revision=$revision"
          ansible-playbook ansible/playbooks/stage-mcp-release.yml -i localhost, -c local -e "lcd_sound_revision=$revision"
          test -x "$HOME/.local/share/gway-lcd-sound/mcp-releases/$revision/scripts/gway/lcd-sound-mcp"
          test -z "$(find "$HOME/.local/share/gway-lcd-sound/mcp-releases" -maxdepth 1 -name '.staging.*' -print -quit)"
      - name: Exercise MCP manifest rollback and convergence in temporary CI paths
        env:
          HOME: ${{ runner.temp }}/lcd-sound-mcp-home
        run: |
          set -eu
          revision=$(git rev-parse HEAD)
          releases="$HOME/.local/share/gway-lcd-sound/mcp-releases"
          registry="${{ runner.temp }}/mcp-registry-test"
          mkdir -p "$registry"
          printf '%s\n' '{"source_id":"previous","revision":"prior"}' > "$registry/lcd_sound.json"
          cp "$registry/lcd_sound.json" "${{ runner.temp }}/previous-manifest.json"
          vars="lcd_sound_revision=$revision lcd_sound_release_root=$releases lcd_sound_manifest_dir=$registry lcd_sound_manifest_path=$registry/lcd_sound.json"
          if sudo -n ansible-playbook ansible/playbooks/publish-mcp.yml -i localhost, -c local -e "$vars lcd_sound_test_inject_verify_failure=true"; then
            echo "Fault-injected publication unexpectedly succeeded" >&2
            exit 1
          fi
          cmp "$registry/lcd_sound.json" "${{ runner.temp }}/previous-manifest.json"
          sudo -n ansible-playbook ansible/playbooks/publish-mcp.yml -i localhost, -c local -e "$vars"
          cp "$registry/lcd_sound.json" "${{ runner.temp }}/published-manifest.json"
          sudo -n ansible-playbook ansible/playbooks/publish-mcp.yml -i localhost, -c local -e "$vars"
          cmp "$registry/lcd_sound.json" "${{ runner.temp }}/published-manifest.json"
          python -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["revision"] == sys.argv[2]' "$registry/lcd_sound.json" "$revision"
      - name: Deploy LCD Sound in isolated HOME
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          mkdir -p "$HOME"
          sh deploy.sh
          test -L "$HOME/.local/share/gway-lcd-sound/current"
          test -x "$HOME/.local/bin/lcd-lockfile-runner"
          test -x "$HOME/.local/bin/gway-event-sound-monitor"
      - name: Redeploy same SHA and verify idempotency
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          before=$(readlink "$HOME/.local/share/gway-lcd-sound/current")
          sh deploy.sh
          after=$(readlink "$HOME/.local/share/gway-lcd-sound/current")
          test "$before" = "$after"
          test -z "$(find "$HOME/.local/share/gway-lcd-sound/releases" -maxdepth 1 -name '.staging.*' -print -quit)"
      - name: Reject corrupted existing release
        env:
          HOME: ${{ runner.temp }}/lcd-sound-home
        run: |
          current="$HOME/.local/share/gway-lcd-sound/current"
          target=$(readlink -f "$current")
          rm -f "$target/scripts/gway/lcd_engine/hardware/discovery.py"
          if sh deploy.sh; then
            echo "Corrupt immutable release unexpectedly accepted" >&2
            exit 1
          fi
          test "$(readlink -f "$current")" = "$target"
