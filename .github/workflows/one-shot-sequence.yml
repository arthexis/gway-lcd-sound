name: One-shot sound sequences
on:
  pull_request:
    paths:
      - "scripts/gway/sound.sh"
      - "scripts/gway/gway-lcd-sound"
      - "scripts/gway/gway-piano.py"
      - "scripts/gway/sound_sequence.py"
      - "scripts/gway/lcd_sound_mcp.py"
      - "tests/test_sound_sequence*.py"
      - "tests/test_lcd_sound_mcp_sequence.py"
      - ".github/workflows/one-shot-sequence.yml"
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Shell syntax
        run: bash -n scripts/gway/sound.sh scripts/gway/gway-lcd-sound
      - name: Python syntax
        run: python -m compileall -q scripts/gway/sound_sequence.py scripts/gway/lcd_sound_mcp.py scripts/gway/gway-piano.py
      - name: One-shot offline tests
        run: python -m pytest -q tests/test_sound_sequence.py tests/test_sound_sequence_cli.py tests/test_sound_sequence_lock.py tests/test_lcd_sound_mcp_sequence.py
