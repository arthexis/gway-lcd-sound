name: Python checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run hardware-free tests
        env:
          PYTHONPATH: scripts/gway
        run: python -m pytest -q tests/
      - name: Validate installer shell syntax
        run: bash -n scripts/deploy/install.sh
