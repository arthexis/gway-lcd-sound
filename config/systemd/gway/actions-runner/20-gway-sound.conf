# Install as a drop-in for a generated GitHub Actions runner unit, for example:
# /etc/systemd/system/actions.runner.<owner>-<repo>.<runner>.service.d/20-gway-sound.conf
#
# Playback shares the existing GPIO lock. A busy or muted buzzer never delays
# or fails the runner service.
[Service]
Environment=CODEX_SOUND_HOOK_LOCK_WAIT=0
Environment=CODEX_SOUND_HOOK_TIMEOUT=2
ExecStartPost=-/home/arthe/.local/bin/codex-sound-hook actions-runner-start notice
ExecStopPost=-/home/arthe/.local/bin/codex-sound-hook actions-runner-stop warning
