---
- name: Require non-root deployment user
  ansible.builtin.assert:
    that:
      - ansible_user_uid | int != 0
    fail_msg: LCD Sound deployment must run without root privileges.

- name: Identify checkout revision
  ansible.builtin.command:
    argv: [git, -C, "{{ gway_lcd_sound_source }}", rev-parse, --short=12, HEAD]
  register: gway_lcd_sound_revision
  changed_when: false

- name: Set release paths
  ansible.builtin.set_fact:
    gway_lcd_sound_release: "{{ gway_lcd_sound_prefix }}/releases/{{ gway_lcd_sound_revision.stdout }}"
    gway_lcd_sound_current: "{{ gway_lcd_sound_prefix }}/current"

- name: Create installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ gway_lcd_sound_prefix }}"
    - "{{ gway_lcd_sound_prefix }}/releases"
    - "{{ gway_lcd_sound_bin_dir }}"
    - "{{ gway_lcd_sound_unit_dir }}"

- name: Inspect immutable release
  ansible.builtin.stat:
    path: "{{ gway_lcd_sound_release }}"
    follow: false
  register: gway_lcd_sound_existing

- name: Verify existing release imports
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import pathlib,sys;
        sys.path.insert(0,str(pathlib.Path(sys.argv[1]).resolve()));
        import lcd_engine.hardware.discovery;
        import lcd_engine.system_info.collectors;
        import sound_engine.events;
        import event_engine.app_observer;
        import event_engine.observer_lock;
        import event_engine.notification_journal
      - "{{ gway_lcd_sound_release }}/scripts/gway"
  register: gway_lcd_sound_existing_probe
  changed_when: false
  failed_when: false
  when: gway_lcd_sound_existing.stat.exists | default(false)

- name: Reject incomplete immutable release
  ansible.builtin.assert:
    that:
      - gway_lcd_sound_existing.stat.isdir | default(false)
      - gway_lcd_sound_existing_probe.rc | default(1) == 0
    fail_msg: Existing immutable LCD Sound release is incomplete; refusing to modify it.
  when: gway_lcd_sound_existing.stat.exists | default(false)

- name: Create release staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ gway_lcd_sound_prefix }}/releases"
    prefix: .staging.
  register: gway_lcd_sound_staging
  when: not (gway_lcd_sound_existing.stat.exists | default(false))

- name: Prepare immutable release
  when: not (gway_lcd_sound_existing.stat.exists | default(false))
  block:
    - name: Copy executable sources into staging
      ansible.builtin.copy:
        src: "{{ gway_lcd_sound_source }}/scripts/gway/"
        dest: "{{ gway_lcd_sound_staging.path }}/scripts/gway/"
        mode: preserve

    - name: Inspect optional observer unit
      ansible.builtin.stat:
        path: "{{ gway_lcd_sound_source }}/scripts/deploy/systemd/user/gway-app-observer.service"
      register: gway_lcd_sound_observer_source

    - name: Copy observer unit into staging
      ansible.builtin.copy:
        src: "{{ gway_lcd_sound_source }}/scripts/deploy/systemd/user/gway-app-observer.service"
        dest: "{{ gway_lcd_sound_staging.path }}/scripts/deploy/systemd/user/gway-app-observer.service"
        mode: "0644"
      when: gway_lcd_sound_observer_source.stat.exists

    - name: Verify staged imports
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import pathlib,sys;
            sys.path.insert(0,str(pathlib.Path(sys.argv[1]).resolve()));
            import lcd_engine.hardware.discovery;
            import lcd_engine.system_info.collectors;
            import sound_engine.events;
            import event_engine.app_observer;
            import event_engine.observer_lock;
            import event_engine.notification_journal
          - "{{ gway_lcd_sound_staging.path }}/scripts/gway"
      changed_when: false

    - name: Publish immutable release
      ansible.builtin.command:
        argv: [mv, "{{ gway_lcd_sound_staging.path }}", "{{ gway_lcd_sound_release }}"]
      changed_when: true
  always:
    - name: Remove unused staging directory
      ansible.builtin.file:
        path: "{{ gway_lcd_sound_staging.path }}"
        state: absent

- name: Verify candidate commands exist
  ansible.builtin.stat:
    path: "{{ gway_lcd_sound_release }}/scripts/gway/{{ item.value }}"
  loop: "{{ gway_lcd_sound_commands | dict2items }}"
  register: gway_lcd_sound_command_files

- name: Require every candidate command
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
    fail_msg: "Missing candidate command: {{ item.item.key }}"
  loop: "{{ gway_lcd_sound_command_files.results }}"

- name: Inspect active release before cutover
  ansible.builtin.stat:
    path: "{{ gway_lcd_sound_current }}"
    follow: false
  register: gway_lcd_sound_prior_link

- name: Resolve prior active release
  ansible.builtin.command:
    argv: [readlink, -f, "{{ gway_lcd_sound_current }}"]
  register: gway_lcd_sound_prior_target
  changed_when: false
  when: gway_lcd_sound_prior_link.stat.islnk | default(false)

- name: Inspect candidate observer unit
  ansible.builtin.stat:
    path: "{{ gway_lcd_sound_release }}/scripts/deploy/systemd/user/gway-app-observer.service"
  register: gway_lcd_sound_observer_unit

- name: Ensure observer remains shadow-only before cutover
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - --
      - "--notification-mode shadow"
      - "{{ gway_lcd_sound_release }}/scripts/deploy/systemd/user/gway-app-observer.service"
  changed_when: false
  when: gway_lcd_sound_observer_unit.stat.exists

- name: Activate and verify candidate with recovery on failure
  block:
    - name: Expose stable commands
      ansible.builtin.file:
        src: "{{ gway_lcd_sound_current }}/scripts/gway/{{ item.value }}"
        dest: "{{ gway_lcd_sound_bin_dir }}/{{ item.key }}"
        state: link
        force: true
      loop: "{{ gway_lcd_sound_commands | dict2items }}"

    - name: Install observer user unit without starting it
      ansible.builtin.file:
        src: "{{ gway_lcd_sound_current }}/scripts/deploy/systemd/user/gway-app-observer.service"
        dest: "{{ gway_lcd_sound_unit_dir }}/gway-app-observer.service"
        state: link
        force: true
      when: gway_lcd_sound_observer_unit.stat.exists

    - name: Atomically switch current to verified candidate
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import os,sys,tempfile;
            from pathlib import Path;
            current=Path(sys.argv[1]);
            target=sys.argv[2];
            tmp=current.parent / ('.current.' + next(tempfile._get_candidate_names()));
            os.symlink(target,tmp);
            os.replace(tmp,current)
          - "{{ gway_lcd_sound_current }}"
          - "{{ gway_lcd_sound_release }}"
      changed_when: true
      when: (gway_lcd_sound_prior_target.stdout | default('')) != gway_lcd_sound_release

    - name: Verify installed command interfaces
      ansible.builtin.command:
        argv: ["{{ gway_lcd_sound_bin_dir }}/{{ item }}", --help]
      loop:
        - lcd-lockfile-runner
        - lcd-system-info-publisher
        - gway-event-sound-monitor
        - gway-app-observer
      changed_when: false

    - name: Verify active release target
      ansible.builtin.command:
        argv: [readlink, -f, "{{ gway_lcd_sound_current }}"]
      register: gway_lcd_sound_active_target
      changed_when: false
      failed_when: gway_lcd_sound_active_target.stdout != gway_lcd_sound_release

  rescue:
    - name: Restore previous active release atomically
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import os,sys,tempfile;
            from pathlib import Path;
            current=Path(sys.argv[1]);
            target=sys.argv[2];
            tmp=current.parent / ('.current.' + next(tempfile._get_candidate_names()));
            os.symlink(target,tmp);
            os.replace(tmp,current)
          - "{{ gway_lcd_sound_current }}"
          - "{{ gway_lcd_sound_prior_target.stdout }}"
      when: gway_lcd_sound_prior_target.stdout | default('') | length > 0

    - name: Fail deployment after recovery attempt
      ansible.builtin.fail:
        msg: LCD Sound candidate failed activation or verification; previous release restored when available.

- name: Record prior release only after successful cutover
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os,sys,tempfile;
        from pathlib import Path;
        previous=Path(sys.argv[1]);
        target=sys.argv[2];
        tmp=previous.parent / ('.previous.' + next(tempfile._get_candidate_names()));
        os.symlink(target,tmp);
        os.replace(tmp,previous)
      - "{{ gway_lcd_sound_prefix }}/previous"
      - "{{ gway_lcd_sound_prior_target.stdout }}"
  changed_when: true
  when:
    - gway_lcd_sound_prior_target.stdout | default('') | length > 0
    - gway_lcd_sound_prior_target.stdout != gway_lcd_sound_release
