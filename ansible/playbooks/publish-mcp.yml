---
# Explicit opt-in only. Never included from install.yml or deploy.sh.
- name: Publish pinned LCD Sound MCP provider
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lcd_sound_release_root: /home/arthe/.local/share/gway-lcd-sound/mcp-releases
    lcd_sound_manifest_dir: /etc/gway-mcp-providers
    lcd_sound_manifest_path: /etc/gway-mcp-providers/lcd_sound.json
  tasks:
    - name: Require root and immutable SHA
      ansible.builtin.assert:
        that:
          - lookup('pipe', 'id -u') == '0'
          - lcd_sound_revision is defined
          - lcd_sound_revision is match('^[a-f0-9]{40}$')
    - name: Validate optional broker checkout and runner
      when: lcd_sound_deployment_checkout is defined
      block:
        - ansible.builtin.assert:
            that:
              - lcd_sound_deployment_revision is defined
              - lcd_sound_deployment_revision is match('^[a-f0-9]{40}$')
              - lcd_sound_deployment_checkout == '/home/arthe/.local/share/gway-lcd-sound/checkouts/' ~ lcd_sound_deployment_revision
        - ansible.builtin.stat:
            path: "{{ lcd_sound_deployment_checkout }}"
            follow: false
          register: broker_checkout
        - ansible.builtin.assert:
            that:
              - broker_checkout.stat.isdir | default(false)
              - not (broker_checkout.stat.islnk | default(false))
              - broker_checkout.stat.pw_name == 'arthe'
              - not (broker_checkout.stat.wgrp | default(true))
              - not (broker_checkout.stat.woth | default(true))
        - ansible.builtin.stat:
            path: "{{ lcd_sound_deployment_checkout }}/broker-deploy.sh"
            follow: false
          register: broker_runner
        - ansible.builtin.assert:
            that:
              - broker_runner.stat.isreg | default(false)
              - not (broker_runner.stat.islnk | default(false))
              - broker_runner.stat.executable | default(false)
              - broker_runner.stat.pw_name == 'arthe'
              - not (broker_runner.stat.wgrp | default(true))
              - not (broker_runner.stat.woth | default(true))
    - name: Inspect release without following links
      ansible.builtin.stat:
        path: "{{ lcd_sound_release_root }}/{{ lcd_sound_revision }}"
        follow: false
      register: release
    - name: Require preinstalled immutable release
      ansible.builtin.assert:
        that:
          - release.stat.isdir | default(false)
          - not (release.stat.islnk | default(false))
    - name: Inspect MCP provider and dispatcher
      ansible.builtin.stat:
        path: "{{ lcd_sound_release_root }}/{{ lcd_sound_revision }}/scripts/gway/{{ item }}"
        follow: false
      loop:
        - lcd-sound-mcp
        - lcd_sound_mcp.py
        - gway-lcd-sound
        - lcd_control.py
        - sound.sh
      register: files
    - name: Require regular release-owned files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
      loop: "{{ files.results }}"
    - name: Require executable provider entrypoint
      ansible.builtin.assert:
        that:
          - files.results[0].stat.executable | default(false)
    - name: Inspect existing provider registry without following symlinks
      ansible.builtin.stat:
        path: "{{ lcd_sound_manifest_dir }}"
        follow: false
      register: registry
    - name: Reject symlinked or non-directory registry
      ansible.builtin.assert:
        that:
          - not (registry.stat.islnk | default(false))
          - not (registry.stat.exists | default(false)) or (registry.stat.isdir | default(false))
    - name: Ensure root-owned provider registry exists
      ansible.builtin.file:
        path: "{{ lcd_sound_manifest_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Inspect existing manifest without following symlinks
      ansible.builtin.stat:
        path: "{{ lcd_sound_manifest_path }}"
        follow: false
      register: existing_manifest
    - name: Reject symlinked or nonregular manifest
      ansible.builtin.assert:
        that:
          - not (existing_manifest.stat.islnk | default(false))
          - not (existing_manifest.stat.exists | default(false)) or (existing_manifest.stat.isreg | default(false))
    - name: Snapshot existing manifest for rollback
      ansible.builtin.slurp:
        src: "{{ lcd_sound_manifest_path }}"
      register: previous_manifest
      when: existing_manifest.stat.exists | default(false)
    - name: Require trusted existing manifest
      ansible.builtin.assert:
        that:
          - existing_manifest.stat.uid == 0
          - existing_manifest.stat.mode == '0644'
      when: existing_manifest.stat.exists | default(false)
    - name: Preserve existing broker pin unless explicitly refreshed
      ansible.builtin.set_fact:
        broker_declaration: "{{ (previous_manifest.content | b64decode | from_json).get('deployment', {}) if existing_manifest.stat.exists | default(false) else {} }}"
    - name: Bind explicitly authorized target
      ansible.builtin.set_fact:
        broker_declaration: "{{ {'schema': 1, 'checkout': lcd_sound_deployment_checkout, 'runner': lcd_sound_deployment_checkout ~ '/broker-deploy.sh', 'revision': lcd_sound_deployment_revision} }}"
      when: lcd_sound_deployment_checkout is defined
    - name: Publish and verify pinned manifest, restoring prior state on failure
      block:
        - name: Publish pinned manifest atomically and idempotently
          ansible.builtin.copy:
            dest: "{{ lcd_sound_manifest_path }}"
            owner: root
            group: root
            mode: '0644'
            content: "{{ {'source_id': 'lcd_sound', 'revision': lcd_sound_revision, 'executable': lcd_sound_release_root ~ '/' ~ lcd_sound_revision ~ '/scripts/gway/lcd-sound-mcp', 'argv': [lcd_sound_release_root ~ '/' ~ lcd_sound_revision ~ '/scripts/gway/lcd-sound-mcp']} | combine({'deployment': broker_declaration} if broker_declaration else {}) | to_json }}\n"

        - name: Read back published manifest
          ansible.builtin.slurp:
            src: "{{ lcd_sound_manifest_path }}"
          register: published_manifest
        - name: Inject offline publication verification failure when explicitly requested
          ansible.builtin.assert:
            that:
              - not (lcd_sound_test_inject_verify_failure | default(false) | bool)
            fail_msg: Offline manifest verification fault injection
        - name: Verify exact pinned manifest revision and executable
          ansible.builtin.assert:
            that:
              - (published_manifest.content | b64decode | from_json).revision == lcd_sound_revision
              - (published_manifest.content | b64decode | from_json).executable == lcd_sound_release_root ~ '/' ~ lcd_sound_revision ~ '/scripts/gway/lcd-sound-mcp'
              - (published_manifest.content | b64decode | from_json).source_id == 'lcd_sound'
              - (published_manifest.content | b64decode | from_json).get('deployment', {}) == broker_declaration
      rescue:
        - name: Restore previous manifest atomically
          ansible.builtin.copy:
            dest: "{{ lcd_sound_manifest_path }}"
            owner: root
            group: root
            mode: '0644'
            content: "{{ previous_manifest.content | b64decode }}"
          when: existing_manifest.stat.exists | default(false)
        - name: Remove new manifest if no previous state existed
          ansible.builtin.file:
            path: "{{ lcd_sound_manifest_path }}"
            state: absent
          when: not (existing_manifest.stat.exists | default(false))
        - name: Fail closed after rollback
          ansible.builtin.fail:
            msg: LCD Sound MCP publication failed; previous manifest restored
